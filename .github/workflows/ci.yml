name: ArthTrail CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arthtrail-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-checks:
    name: Docs, guardrails and native Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate project documentation
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            LICENSE
            blueprint.md
            SECURITY.md
            docs/PRODUCT_SPEC.md
            docs/HANDOVER.md
            docs/APP_LOCK_DESIGN.md
            docs/AI_SYSTEM_DESIGN.md
            docs/RECURRING_RULES_REMINDERS.md
            docs/MULTI_DEVICE_SYNC.md
            docs/ACCOUNTING_CA_ENTERPRISE.md
            docs/COMPETITOR_FEATURE_REVIEW.md
          )
          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Required project file is missing or empty: $file"
              exit 1
            fi
          done
          grep -qi 'PROPRIETARY SOFTWARE LICENSE' LICENSE
          grep -qi 'No Web App' README.md
          if [ -e BLUEPRINT.md ]; then
            echo 'Keep a single canonical blueprint.md file; do not add BLUEPRINT.md as a duplicate.'
            exit 1
          fi
          grep -qi 'Ritav' docs/AI_SYSTEM_DESIGN.md
          grep -qi 'interest' docs/RECURRING_RULES_REMINDERS.md
          grep -qi 'end-to-end' docs/MULTI_DEVICE_SYNC.md
          grep -qi 'Chartered Accountant' docs/ACCOUNTING_CA_ENTERPRISE.md
          echo 'Required files and proprietary/native-only project markers are present.'

      - name: Detect Flutter application
        id: detect
        shell: bash
        run: |
          if [ -s app/pubspec.yaml ]; then
            echo 'has_flutter_app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_flutter_app=false' >> "$GITHUB_OUTPUT"
            echo 'Flutter source is not initialized yet; native build and Dart tests will be skipped.'
          fi

      - name: Verify native-only dependency guardrails
        if: steps.detect.outputs.has_flutter_app == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '^[[:space:]]*(capacitor|webview_flutter|flutter_webview_plugin|flutter_web):' app/pubspec.yaml; then
            echo 'Forbidden web-wrapper or web-target dependency found in app/pubspec.yaml.'
            exit 1
          fi
          if [ -d app/web ]; then
            echo 'A web target directory is not allowed in this native-only project.'
            exit 1
          fi

      - name: Set up Flutter
        if: steps.detect.outputs.has_flutter_app == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Resolve Flutter dependencies
        if: steps.detect.outputs.has_flutter_app == 'true'
        working-directory: app
        run: flutter pub get

      - name: Check Dart formatting
        if: steps.detect.outputs.has_flutter_app == 'true'
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart and Flutter code
        if: steps.detect.outputs.has_flutter_app == 'true'
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Run automated tests
        if: steps.detect.outputs.has_flutter_app == 'true'
        working-directory: app
        run: flutter test --reporter expanded

      - name: Build native Android debug APK
        if: steps.detect.outputs.has_flutter_app == 'true'
        working-directory: app
        run: flutter build apk --debug

      - name: Upload debug APK for testing
        if: steps.detect.outputs.has_flutter_app == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arthtrail-android-debug-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

# No secrets are required by this workflow. Do not add signing keys, Firebase
# service-account keys, finance data, or paid-provider credentials to CI.
# Standard public GitHub-hosted runners are used to keep the target budget at ₹0.